<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login | Northstar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar site-nav">
    <div class="container py-2">
        <a class="navbar-brand" th:href="@{/}">Northstar</a>
        <a class="nav-link" th:href="@{/}">Back to home</a>
    </div>
</nav>

<main class="section">
    <div class="container">
        <div class="form-card">
            <h1 class="section-title mb-2">Client login</h1>
            <p class="section-copy mb-4">Sign in to your Northstar account.</p>

            <div th:if="${message}" class="alert alert-secondary" th:text="${message}"></div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
