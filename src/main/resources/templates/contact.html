<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Northstar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg site-nav">
    <div class="container py-2">
        <a class="navbar-brand" th:href="@{/}">Northstar</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Home</a>
            <a class="nav-link" th:href="@{/about}">About</a>
            <a class="nav-link" th:href="@{/documents}">Documents</a>
            <a class="nav-link" th:href="@{/contact}">Contact</a>
            <a class="nav-link login-link" th:href="@{/login}">Client login</a>
        </div>
    </div>
</nav>

<header class="page-header">
    <div class="container">
        <h1>Contact us</h1>
        <p>Send us a message and we'll get back to you.</p>
    </div>
</header>

<main class="section">
    <div class="container">
        <div class="form-card">
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <form method="post" th:action="@{/contact}">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input id="name" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" name="email" type="email" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" name="message" rows="5" class="form-control" required></textarea>
                </div>
                <button class="btn btn-primary px-4" type="submit">Send message</button>
            </form>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container d-flex justify-content-between"><strong>Northstar</strong><span>© 2026 Northstar Business Services</span></div>
</footer>
</body>
</html>
